services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: contract-checker-myself-web

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: ./start.sh # eikhane "uv run python manage.py migrate" and "uv run python manage.py runserver 0.0.0.0:8000" ei duita command cole

    # environment:
    #   - PYTHONUNBUFFERED=1

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: contract-checker-myself-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

